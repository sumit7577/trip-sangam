version: '3.8'

# Sangam Travels deploy stack — mirrors allcoachingAdmin's nginx-proxy pattern.
#
#   sangam-backend   Django + Wagtail (gunicorn) — internal port 8000
#                    exposed at https://${CMS_DOMAIN} via sumit_proxy (nginx-proxy
#                    + acme-companion handles cert issuance + renewal)
#   sangam-frontend  Next.js (standalone) — internal port 3000
#                    exposed at https://${SITE_DOMAIN}
#
# Both containers join the external sumit_proxy network (created once on the
# host) so the existing nginx-proxy + acme-companion picks them up via their
# VIRTUAL_HOST / LETSENCRYPT_HOST env vars. They also share an internal
# `sangam-net` so the frontend can reach the backend by service name without
# exposing ports to the host.

services:
  sangam-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sangam-backend:latest
    container_name: sangam-backend
    restart: always
    expose:
      - "8000"
    environment:
      # nginx-proxy / acme-companion configuration ─────────────────────────
      - VIRTUAL_HOST=${CMS_DOMAIN}
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=${CMS_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - REDIRECT_HTTPS=false

      # Django ─────────────────────────────────────────────────────────────
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=${CMS_DOMAIN},sangam-backend,localhost,127.0.0.1
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - WAGTAILADMIN_BASE_URL=https://${CMS_DOMAIN}
      - NEXTJS_PREVIEW_URL=https://${SITE_DOMAIN}/preview/
      - CORS_ALLOWED_ORIGINS=https://${SITE_DOMAIN}
      - CSRF_TRUSTED_ORIGINS=https://${CMS_DOMAIN},https://${SITE_DOMAIN}

      # Bunny CDN (leave blank to use local /app/media volume) ──────────────
      - BUNNY_STORAGE_ZONE_NAME=${BUNNY_STORAGE_ZONE_NAME:-}
      - BUNNY_STORAGE_ACCESS_KEY=${BUNNY_STORAGE_ACCESS_KEY:-}
      - BUNNY_STORAGE_PUBLIC_HOST=${BUNNY_STORAGE_PUBLIC_HOST:-}
      - BUNNY_STORAGE_API_HOST=${BUNNY_STORAGE_API_HOST:-storage.bunnycdn.com}
      - BUNNY_STORAGE_DIRECTORY=${BUNNY_STORAGE_DIRECTORY:-sangam/}

      # PhonePe payments — set these in the VM .env to activate deposits.
      # Blank ⇒ pay endpoints return 503 (booking/accept still work).
      - PHONEPE_ENV=${PHONEPE_ENV:-sandbox}
      - PHONEPE_CLIENT_ID=${PHONEPE_CLIENT_ID:-}
      - PHONEPE_CLIENT_SECRET=${PHONEPE_CLIENT_SECRET:-}
      - PHONEPE_CLIENT_VERSION=${PHONEPE_CLIENT_VERSION:-1}
      - PHONEPE_WEBHOOK_USERNAME=${PHONEPE_WEBHOOK_USERNAME:-}
      - PHONEPE_WEBHOOK_PASSWORD=${PHONEPE_WEBHOOK_PASSWORD:-}
      - PHONEPE_REDIRECT_BASE=https://${SITE_DOMAIN}/trips

      # Razorpay (active gateway) — set keys in the VM .env to activate payments.
      # Blank ⇒ pay endpoints return 503 (booking/accept still work).
      # Webhook URL to register on the dashboard: https://${CMS_DOMAIN}/api/webhooks/razorpay/
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}

      # Email (booking notifications) — set SMTP creds in the VM .env to send.
      # Blank host ⇒ sends are attempted then silently swallowed.
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-Trip Sangam <noreply@tripsangam.com>}
      - SITE_PUBLIC_URL=https://${SITE_DOMAIN}

      # Firebase phone-auth. Prefer the mounted file (FIREBASE_CREDENTIALS_FILE)
      # — a long JSON string doesn't survive .env parsing reliably.
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON:-}
      - FIREBASE_CREDENTIALS_FILE=${FIREBASE_CREDENTIALS_FILE:-}

      # Postgres — when POSTGRES_DB is set in the VM .env the app uses Postgres;
      # blank ⇒ falls back to the SQLite volume below (clean rollback path).
      - POSTGRES_DB=${POSTGRES_DB:-}
      - POSTGRES_USER=${POSTGRES_USER:-sangam}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-sangam-db-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    volumes:
      - sangam-db:/app/data
      - sangam-static:/app/staticfiles
      - sangam-media:/app/media
      # Firebase service-account key (gitignored; placed on the VM out-of-band).
      - ./firebase-sa.json:/app/firebase-sa.json:ro
    depends_on:
      sangam-db-postgres:
        condition: service_healthy
    networks:
      - proxy
      - sangam-net

  sangam-db-postgres:
    image: postgres:16
    container_name: sangam-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sangam}
      - POSTGRES_USER=${POSTGRES_USER:-sangam}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sangam}
    volumes:
      - sangam-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sangam} -d ${POSTGRES_DB:-sangam}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - sangam-net

  sangam-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the CLIENT bundle at build time, so the
        # browser must get the PUBLIC API URL. Server-side (ISR) fetches use
        # API_INTERNAL_URL (set at runtime below) to stay in-cluster.
        NEXT_PUBLIC_API_URL: https://${CMS_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        # Firebase phone-auth (client). Blank ⇒ phone login hidden, email used.
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    image: sangam-frontend:latest
    container_name: sangam-frontend
    restart: always
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=${SITE_DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${SITE_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - REDIRECT_HTTPS=false
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${CMS_DOMAIN}
      - API_INTERNAL_URL=http://sangam-backend:8000
      - NEXT_PUBLIC_SITE_URL=https://${SITE_DOMAIN}
    depends_on:
      - sangam-backend
    networks:
      - proxy
      - sangam-net

networks:
  proxy:
    external: true
    name: sumit_proxy
  sangam-net:
    driver: bridge

volumes:
  sangam-db:
  sangam-static:
  sangam-media:
  sangam-pgdata:
